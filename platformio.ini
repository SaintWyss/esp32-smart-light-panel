[platformio]
default_envs = waveshare_esp32_s3_touch_lcd_7

[env:waveshare_esp32_s3_touch_lcd_7]
; Waveshare's library bundle targets Arduino-ESP32 3.x. Official PlatformIO
; remains on Arduino 2.0.17, so pin the compatible pioarduino 3.0.7 release.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5C37247963-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5C37247963-if00
monitor_speed = 115200
lib_ldf_mode = deep+
build_unflags =
    -std=gnu++11
    -Os
build_flags =
    -std=gnu++17
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
